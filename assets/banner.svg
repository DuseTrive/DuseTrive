<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 130" width="860" height="130" role="img" aria-label="DuseTrive">
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9d5ff"/><stop offset=".6" stop-color="#7dd3fc"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="860" height="130" fill="#0b0f1e"/>
  <!-- 4 phrases, 4s each, 16s loop; each glitch-swaps in with RGB split -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" text-anchor="middle" letter-spacing="1">
    <!-- phrase 1: DuseTrive -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;.02;.06;.23;.25;1" dur="16s" repeatCount="indefinite"/>
      <text x="430" y="80" fill="#ff2d78" opacity=".7">DuseTrive
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 1;3 0;0 0" keyTimes="0;.01;.02;.04" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="80" fill="#22d3ee" opacity=".7">DuseTrive
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -1;-3 0;0 0" keyTimes="0;.01;.02;.04" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="80" fill="url(#ng)">DuseTrive</text>
    </g>
    <!-- phrase 2: root@dusetrive:~# -->
    <g opacity="0" font-family="Consolas, Menlo, monospace" font-size="44">
      <animate attributeName="opacity" values="0;0;1;1;1;0;0" keyTimes="0;.25;.27;.31;.48;.5;1" dur="16s" repeatCount="indefinite"/>
      <text x="430" y="78" fill="#ff2d78" opacity=".7">root@dusetrive:~#
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 1;3 0;0 0" keyTimes="0;.26;.27;.29" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="78" fill="#22d3ee" opacity=".7">root@dusetrive:~#
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -1;-3 0;0 0" keyTimes="0;.26;.27;.29" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="78" fill="url(#ng)">root@dusetrive:~#</text>
    </g>
    <!-- phrase 3: BREAK · DETECT · DOCUMENT -->
    <g opacity="0" font-size="40" letter-spacing="4">
      <animate attributeName="opacity" values="0;0;1;1;1;0;0" keyTimes="0;.5;.52;.56;.73;.75;1" dur="16s" repeatCount="indefinite"/>
      <text x="430" y="78" fill="#ff2d78" opacity=".7">BREAK · DETECT · DOCUMENT
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 1;3 0;0 0" keyTimes="0;.51;.52;.54" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="78" fill="#22d3ee" opacity=".7">BREAK · DETECT · DOCUMENT
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -1;-3 0;0 0" keyTimes="0;.51;.52;.54" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="78" fill="url(#ng)">BREAK · DETECT · DOCUMENT</text>
    </g>
    <!-- phrase 4: CyberCenturions -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;.75;.77;.81;.98;1" dur="16s" repeatCount="indefinite"/>
      <text x="430" y="80" fill="#ff2d78" opacity=".7">CyberCenturions
        <animateTransform attributeName="transform" type="translate" values="0 0;-4 1;3 0;0 0" keyTimes="0;.76;.77;.79" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="80" fill="#22d3ee" opacity=".7">CyberCenturions
        <animateTransform attributeName="transform" type="translate" values="0 0;4 -1;-3 0;0 0" keyTimes="0;.76;.77;.79" dur="16s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="80" fill="url(#ng)">CyberCenturions</text>
    </g>
  </g>
  <line x1="0" x2="860" y1="98" y2="98" stroke="#22d3ee" stroke-width="1" opacity=".35">
    <animate attributeName="y1" values="20;110;20" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="20;110;20" dur="5s" repeatCount="indefinite"/>
  </line>
</svg>
